# Profile debug nhanh trên CPU: cửa sổ dữ liệu ngắn, ít bước ADVI, 1 seed.
# Dùng để kiểm tra đúng/sai trước khi chạy full-scale.
device_preference: auto
window_sessions: 500        # chỉ dùng 500 phiên gần nhất để lặp nhanh
seeds: [0]
advi:
  n_steps: 300
  learning_rate: 0.05
  warmup_steps: 20
  grad_clip_norm: 10.0
  elbo_ma_window: 20
  early_stop_patience: 100
  min_delta: 0.001
  retry_lr_factor: 0.5
  max_retries: 3
  n_mc_samples: 4
prior:
  hyper_mean_scale: 1.0
  min_effective_observations: 30.0
  min_effective_fraction: 0.05   # regime chiếm dưới 5% occupancy -> shrinkage thật sự
