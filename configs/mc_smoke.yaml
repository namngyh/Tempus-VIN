# configs/mc_smoke.yaml
# Profile debug nhanh cho scenario-return + Monte Carlo: cua so ngan, it
# buoc ADVI, quy mo Monte Carlo nho (500 path) - dung de kiem chung logic
# dung, KHONG phai so lieu VaR/CVaR nghien cuu cuoi cung.
device_preference: auto
window_sessions: 1500
seeds: [0]
ms_egarch_advi:
  n_steps: 300
  learning_rate: 0.05
  warmup_steps: 20
  grad_clip_norm: 10.0
  elbo_ma_window: 20
  early_stop_patience: 100
  min_delta: 0.001
  retry_lr_factor: 0.5
  max_retries: 3
  n_mc_samples: 4
ms_egarch_prior:
  hyper_mean_scale: 1.0
  min_effective_observations: 30.0
  min_effective_fraction: 0.05
mu_advi:
  n_steps: 300
  learning_rate: 0.05
  warmup_steps: 20
  grad_clip_norm: 10.0
  elbo_ma_window: 20
  early_stop_patience: 100
  min_delta: 0.001
  retry_lr_factor: 0.5
  max_retries: 3
  n_mc_samples: 4
mu_n_draws: 50
mu_prior_scale: 0.01
mu_min_effective_observations: 30.0
mc_n_paths: 500
mc_horizon: 20
mc_report_horizons: [1, 20]
mc_alphas: [0.95, 0.99]
